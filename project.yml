name: Trayce
options:
  bundleIdPrefix: com.alcor
  deploymentTarget:
    iOS: "27.0"
  createIntermediateGroups: true
packages:
  TrayceCore:
    path: Packages/TrayceCore
settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_DEFAULT_ACTOR_ISOLATION: MainActor
    SWIFT_APPROACHABLE_CONCURRENCY: YES
    SUPPORTS_MACCATALYST: false
    SUPPORTS_MAC_DESIGNED_FOR_IPHONE_IPAD: false
    SUPPORTS_XR_DESIGNED_FOR_IPHONE_IPAD: false
    TARGETED_DEVICE_FAMILY: "1,2"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    CODE_SIGN_STYLE: Automatic
targets:
  Trayce:
    type: application
    platform: iOS
    sources:
      - Trayce
      - Shared
    dependencies:
      - package: TrayceCore
      - target: TrayceWidgets
    entitlements:
      path: Trayce/Trayce.entitlements
      properties:
        com.apple.security.application-groups: [group.com.alcor.trayce]
    info:
      path: Trayce/Info.plist
      properties:
        CFBundleDisplayName: Trayce
        UILaunchScreen: {}
        NSSupportsLiveActivities: true
        NSCameraUsageDescription: Trayce photographs the items you pack to plan your security trays. Photos stay on this iPhone.
        NSPhotoLibraryUsageDescription: Pick a photo of your packed items or a booking screenshot.
        LSSupportsOpeningDocumentsInPlace: false
        CFBundleDocumentTypes:
          - CFBundleTypeName: Booking document
            CFBundleTypeRole: Viewer
            LSHandlerRank: Alternate
            LSItemContentTypes: [com.adobe.pdf, public.image]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.alcor.trayce
        ASSETCATALOG_COMPILER_APPICON_NAME: ""
  TrayceWidgets:
    type: app-extension
    platform: iOS
    sources:
      - TrayceWidgets
      - Shared
    entitlements:
      path: TrayceWidgets/TrayceWidgets.entitlements
      properties:
        com.apple.security.application-groups: [group.com.alcor.trayce]
    info:
      path: TrayceWidgets/Info.plist
      properties:
        CFBundleDisplayName: Trayce
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.alcor.trayce.widgets
schemes:
  Trayce:
    build:
      targets:
        Trayce: all
    run:
      config: Debug
